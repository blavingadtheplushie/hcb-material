name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KS: ${{ secrets.HCB_KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > release.jks
      - name: Assemble release APK
        env:
          HCB_KEYSTORE_FILE: release.jks
          HCB_KEYSTORE_PASSWORD: ${{ secrets.HCB_KEYSTORE_PASSWORD }}
          HCB_KEY_ALIAS: ${{ secrets.HCB_KEY_ALIAS }}
          HCB_KEY_PASSWORD: ${{ secrets.HCB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }} --console=plain
      - name: Rename APKs
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" | sed 's/^app-/hcb-material-/; s/-release//')
            cp "$f" "out/$n"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: hcb-material-apk
          path: out/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.1.${{ github.run_number }}
          gh release create "$TAG" out/*.apk --title "HCB 0.1.${{ github.run_number }}" --notes "Automatic build from ${{ github.sha }}" --latest
